
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpm-rocco-curator"
version = "1.0.0"
description = "AI-powered curator for the Digital Porous Media Portal"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Bernard Chang", email = "bernard.chang@austin.utexas.edu"},
    {name = "Maria Esteva"},
    {name = "Zachary Nowacek"},
    {name = "Maša Prodanović"}
]
keywords = [
    "dataset-curation",
    "description-evaluation",
    "rag",
    "llm",
    "porous-media",
    "scientific-data"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "langchain>=0.1.0",
    "openai>=1.0.0",
    "streamlit>=1.35.0",
    "langchainhub>=0.1.21",
    "langchain-community>=0.4.1,<0.5.0",  # pinned: sunset announced; migrate before removing (see Tasks.md)
    "langchain-huggingface>=1.2.2",
    "tenacity!=8.4.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "httpx>=0.24.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "pypdf>=3.0.0",
    "regex>=2023.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.0.0",
    "python-dotenv>=1.2.2"
]

[project.optional-dependencies]
graph = [
    "neo4j>=5.27.0",
    "langchain-neo4j>=0.1.1",
    "langchain-openai>=0.2.0",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "myst-parser>=2.0",
    "sphinx-design>=0.5",
    "sphinx-copybutton>=0.5",
    "sphinx-autobuild>=2024.2.4",
    "sphinx-tabs>=3.4.1",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]
benchmarks = [
    "pymc>=6.0.0",
    "krippendorff>=0.6.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.7.0",
    "jupyter>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/digital-porous-media/dpm_rocco_curator"
"Documentation" = "https://digital-porous-media.github.io/dpm_rocco_curator/"
"Repository" = "https://github.com/digital-porous-media/dpm_rocco_curator.git"
"Bug Tracker" = "https://github.com/digital-porous-media/dpm_rocco_curator/issues"
"Zenodo" = "https://doi.org/10.5281/zenodo.20172375"
