
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpm-rocco-curator"
version = "1.0.0"
description = "AI-powered curator for the Digital Porous Media Portal"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Bernard Chang", email = "bernard.chang@austin.utexas.edu"},
    {name = "Maria Esteva"},
    {name = "Zachary Nowacek"},
    {name = "Maša Prodanović"}
]
keywords = [
    "dataset-curation",
    "description-evaluation",
    "rag",
    "llm",
    "porous-media",
    "scientific-data"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "langchain>=0.1.0",
    "openai>=1.0.0",
    "streamlit>=1.35.0",
    "langchain-community>=0.4.1,<0.5.0",  # pinned: sunset announced; migrate before removing (see Tasks.md)
    "langchain-huggingface>=1.2.2",
    "langgraph>=0.2.0",  # required by src/assistant/conversation_manager.py (create_react_agent, MemorySaver); imported unconditionally by rocco_ui.py's assistant tab
    "requests>=2.31.0",  # used by src/assistant/literature_search.py for the Semantic Scholar API
    "docx2txt>=0.8",  # required at runtime by langchain_community's Docx2txtLoader (src/ingestor/document_ingestor.py)
    "tenacity!=8.4.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.24.0",
    "faiss-cpu>=1.7.4",
    "pypdf>=3.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.0.0"
]

[project.optional-dependencies]
graph = [
    "neo4j>=5.27.0",
    "langchain-neo4j>=0.1.1",
    "langchain-openai>=0.2.0",
]
local-embeddings = [
    # Local HuggingFace embedding fallback (src/llm/embeddings.py, src/ingestor/embedder.py).
    # Only needed if LLM_PROVIDER is ollama/huggingface/anthropic/deepseek WITHOUT an
    # EMBEDDING_URL/EMBEDDING_MODEL override, or if DocumentEmbedder() is constructed
    # without an injected `embeddings=`. Pulls in torch (~1.5-2.5GB) — skip for API-based
    # embedding setups (e.g. EMBEDDING_URL pointing at a remote provider).
    "sentence-transformers>=2.2.0",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "myst-parser>=2.0",
    "sphinx-design>=0.5",
    "sphinx-copybutton>=0.5",
    "sphinx-autobuild>=2024.2.4",
    "sphinx-tabs>=3.4.1",
]
manual = [
    # Single-PDF reference manual (scripts/build_manual.py). Layered on top of the
    # `docs` extra, which supplies Sphinx itself.
    "weasyprint>=66",       # HTML -> PDF with CSS Paged Media support
    "pypdf>=4.0",           # PDF metadata and the post-render secret scan
    "playwright>=1.44",     # drives the app for scripts/capture_screenshots.py
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "numpy>=1.24.0",  # only used by tests/assistant/conftest.py fixtures, not by src/
]
benchmarks = [
    "pymc>=6.0.0",
    "krippendorff>=0.6.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.7.0",
    "jupyter>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/digital-porous-media/dpm_rocco_curator"
"Documentation" = "https://digital-porous-media.github.io/dpm_rocco_curator/"
"Repository" = "https://github.com/digital-porous-media/dpm_rocco_curator.git"
"Bug Tracker" = "https://github.com/digital-porous-media/dpm_rocco_curator/issues"
"Zenodo" = "https://doi.org/10.5281/zenodo.20172375"
