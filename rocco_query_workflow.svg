<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1110" width="1300" height="1110" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .box-label { fill: #0b0b0b; font-size: 14px; font-weight: 600; }
    .title     { fill: #0b0b0b; font-size: 20px; font-weight: 700; }
    .subtitle  { fill: #52514e; font-size: 13px; }
    .box-sub   { fill: #52514e; font-size: 11.5px; }
    .box-mono  { fill: #52514e; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .box-file  { fill: #898781; font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .node-fill { fill: #fcfcfb; stroke: rgba(11,11,11,0.14); stroke-width: 1; }
    .edge        { fill: none; stroke: #898781; stroke-width: 1.6; marker-end: url(#arrow); }
    .edge-plain  { fill: none; stroke: #898781; stroke-width: 1.4; }
    .edge-return { fill: none; stroke: #898781; stroke-width: 1.6; stroke-dasharray: 4 3; marker-end: url(#arrow); }
    .legend-swatch { stroke: rgba(11,11,11,0.14); stroke-width: 1; }
    .legend-text   { fill: #52514e; font-size: 11.5px; }
    .badge      { fill: #fcfcfb; stroke: rgba(11,11,11,0.14); stroke-width: 1; }
    .badge-text { fill: #52514e; font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#898781"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="1110" fill="#f9f9f7"/>

  <text x="24" y="34" class="title">What happens to a query — Rocco assistant architecture</text>
  <text x="24" y="56" class="subtitle">Routing is implicit: the LLM in conversation_manager.py reads each tool's description and picks the matching tool(s). Every branch ends in a tool call — never a guess from memory.</text>

  <g transform="translate(0,70)">
    <!-- ============ USER QUERY ============ -->
    <rect x="490" y="10" width="320" height="56" rx="10" class="node-fill" stroke="#4a3aa7" stroke-width="1.6"/>
    <text x="650" y="34" text-anchor="middle" class="box-label">User's question</text>
    <text x="650" y="52" text-anchor="middle" class="box-sub">e.g. "sandstone datasets with φ &gt; 0.2, and how is φ measured?"</text>

    <path d="M650,66 L650,96" class="edge"/>

    <!-- ============ ROUTER ============ -->
    <rect x="440" y="98" width="420" height="70" rx="10" class="node-fill" stroke="#4a3aa7" stroke-width="2.2"/>
    <rect x="440" y="98" width="6" height="70" rx="3" fill="#4a3aa7"/>
    <text x="650" y="124" text-anchor="middle" class="box-label">conversation_manager.py</text>
    <text x="650" y="141" text-anchor="middle" class="box-sub">LangGraph ReAct agent — reads tool descriptions</text>
    <text x="650" y="156" text-anchor="middle" class="box-sub">+ system prompt, decides which tool(s) to call</text>

    <!-- branch lines down to 5 tool boxes -->
    <path d="M650,168 L650,190" class="edge-plain"/>
    <path d="M175,190 L1135,190" class="edge-plain"/>
    <path d="M175,190 L175,206" class="edge"/>
    <path d="M415,190 L415,206" class="edge"/>
    <path d="M655,190 L655,206" class="edge"/>
    <path d="M895,190 L895,206" class="edge"/>
    <path d="M1135,190 L1135,206" class="edge"/>

    <!-- ============ TOOL ROW ============ -->
    <!-- 1: search_datasets -->
    <rect x="70" y="208" width="210" height="78" rx="10" class="node-fill"/>
    <rect x="70" y="208" width="210" height="6" rx="3" fill="#2a78d6"/>
    <text x="175" y="230" text-anchor="middle" class="box-mono">search_datasets()</text>
    <text x="175" y="247" text-anchor="middle" class="box-sub">Fuzzy / suitability query</text>
    <text x="175" y="262" text-anchor="middle" class="box-sub">("good for LBM sim")</text>
    <text x="175" y="277" text-anchor="middle" class="box-file">tools.py</text>

    <!-- 2: get_dataset_details -->
    <rect x="310" y="208" width="210" height="78" rx="10" class="node-fill"/>
    <rect x="310" y="208" width="210" height="6" rx="3" fill="#008300"/>
    <text x="415" y="230" text-anchor="middle" class="box-mono">get_dataset_details()</text>
    <text x="415" y="247" text-anchor="middle" class="box-sub">Exact property / threshold</text>
    <text x="415" y="262" text-anchor="middle" class="box-sub">("porosity &gt; 0.2")</text>
    <text x="415" y="277" text-anchor="middle" class="box-file">tools.py</text>

    <!-- 3: get_workflow_guidance -->
    <rect x="550" y="208" width="210" height="78" rx="10" class="node-fill"/>
    <rect x="550" y="208" width="210" height="6" rx="3" fill="#eda100"/>
    <text x="655" y="230" text-anchor="middle" class="box-mono">get_workflow_guidance()</text>
    <text x="655" y="247" text-anchor="middle" class="box-sub">"How do I compute k?"</text>
    <text x="655" y="262" text-anchor="middle" class="box-sub">step-by-step + tutorial link</text>
    <text x="655" y="277" text-anchor="middle" class="box-file">tools.py</text>

    <!-- 4: get_educational_context -->
    <rect x="790" y="208" width="210" height="78" rx="10" class="node-fill"/>
    <rect x="790" y="208" width="210" height="6" rx="3" fill="#1baf7a"/>
    <text x="895" y="230" text-anchor="middle" class="box-mono">get_educational_context()</text>
    <text x="895" y="247" text-anchor="middle" class="box-sub">"What is porosity?" /</text>
    <text x="895" y="262" text-anchor="middle" class="box-sub">domain Q&amp;A + best practices</text>
    <text x="895" y="277" text-anchor="middle" class="box-file">tools.py</text>

    <!-- 5: search_literature -->
    <rect x="1030" y="208" width="210" height="78" rx="10" class="node-fill"/>
    <rect x="1030" y="208" width="210" height="6" rx="3" fill="#eb6834"/>
    <text x="1135" y="230" text-anchor="middle" class="box-mono">search_literature()</text>
    <text x="1135" y="247" text-anchor="middle" class="box-sub">"find papers on X"</text>
    <text x="1135" y="262" text-anchor="middle" class="box-sub">published-work lookup</text>
    <text x="1135" y="277" text-anchor="middle" class="box-file">tools.py</text>

    <!-- arrows down to supporting components -->
    <path d="M175,286 L175,308" class="edge"/>
    <path d="M415,286 L415,308" class="edge"/>
    <path d="M655,286 L655,308" class="edge"/>
    <path d="M895,286 L895,308" class="edge"/>
    <path d="M1135,286 L1135,308" class="edge"/>

    <!-- ============ SUPPORTING COMPONENTS ROW ============ -->
    <!-- 1 support: query expansion + Neo4j vector search -->
    <rect x="70" y="310" width="210" height="112" rx="10" class="node-fill"/>
    <text x="175" y="330" text-anchor="middle" class="box-sub" font-weight="600">query_expander.yaml</text>
    <text x="175" y="345" text-anchor="middle" class="box-file">LLM rewrites vague query</text>
    <path d="M175,352 L175,362" class="edge-plain"/>
    <text x="175" y="378" text-anchor="middle" class="box-sub" font-weight="600">graph_store.py</text>
    <text x="175" y="393" text-anchor="middle" class="box-file">Neo4j vector index</text>
    <text x="175" y="408" text-anchor="middle" class="box-file">(dataset + component embeddings)</text>

    <!-- 2 support: Neo4j Cypher QA -->
    <rect x="310" y="310" width="210" height="112" rx="10" class="node-fill"/>
    <text x="415" y="330" text-anchor="middle" class="box-sub" font-weight="600">graph_store.py</text>
    <text x="415" y="345" text-anchor="middle" class="box-file">Neo4j Cypher QA chain</text>
    <text x="415" y="365" text-anchor="middle" class="box-file">(GraphCypherQAChain —</text>
    <text x="415" y="378" text-anchor="middle" class="box-file">generates + runs real Cypher</text>
    <text x="415" y="391" text-anchor="middle" class="box-file">against dataset properties)</text>

    <!-- 3 support: workflows + tutorials -->
    <rect x="550" y="310" width="210" height="112" rx="10" class="node-fill"/>
    <text x="655" y="330" text-anchor="middle" class="box-sub" font-weight="600">educational.yaml</text>
    <text x="655" y="345" text-anchor="middle" class="box-file">synthesis prompt</text>
    <path d="M655,352 L655,362" class="edge-plain"/>
    <text x="655" y="378" text-anchor="middle" class="box-sub" font-weight="600">domain_workflows.yaml</text>
    <text x="655" y="393" text-anchor="middle" class="box-file">+ tutorials.yaml</text>
    <text x="655" y="408" text-anchor="middle" class="box-file">(curated DRP workflows)</text>

    <!-- 4 support: workflows + best practices -->
    <rect x="790" y="310" width="210" height="112" rx="10" class="node-fill"/>
    <text x="895" y="330" text-anchor="middle" class="box-sub" font-weight="600">educational.yaml</text>
    <text x="895" y="345" text-anchor="middle" class="box-file">synthesis prompt</text>
    <path d="M895,352 L895,362" class="edge-plain"/>
    <text x="895" y="378" text-anchor="middle" class="box-sub" font-weight="600">domain_workflows.yaml</text>
    <text x="895" y="393" text-anchor="middle" class="box-file">global best practices +</text>
    <text x="895" y="408" text-anchor="middle" class="box-file">Semantic Scholar fallback</text>

    <!-- 5 support: Semantic Scholar -->
    <rect x="1030" y="310" width="210" height="112" rx="10" class="node-fill"/>
    <text x="1135" y="330" text-anchor="middle" class="box-sub" font-weight="600">literature_search.py</text>
    <text x="1135" y="345" text-anchor="middle" class="box-file">Semantic Scholar API</text>
    <text x="1135" y="365" text-anchor="middle" class="box-file">wrapper — titles, abstracts,</text>
    <text x="1135" y="378" text-anchor="middle" class="box-file">DOIs, citation counts</text>
    <text x="1135" y="398" text-anchor="middle" class="box-file">(no local PDF corpus)</text>

    <!-- return edges converging back up -->
    <path d="M175,422 L175,450 L640,450" class="edge-return" marker-end="none"/>
    <path d="M415,422 L415,450" class="edge-return" marker-end="none"/>
    <path d="M655,422 L655,450" class="edge-return" marker-end="none"/>
    <path d="M895,422 L895,450 L660,450" class="edge-return" marker-end="none"/>
    <path d="M1135,422 L1135,450 L660,450" class="edge-return" marker-end="none"/>
    <path d="M650,450 L650,472" class="edge-return"/>

    <!-- ============ SYNTHESIS (back through router) ============ -->
    <rect x="380" y="474" width="540" height="86" rx="10" class="node-fill" stroke="#4a3aa7" stroke-width="2.2"/>
    <rect x="380" y="474" width="6" height="86" rx="3" fill="#4a3aa7"/>
    <text x="650" y="500" text-anchor="middle" class="box-label">conversation_manager.py — synthesis</text>
    <text x="650" y="518" text-anchor="middle" class="box-sub">Combines tool result(s); dataset facts are spliced in verbatim</text>
    <text x="650" y="533" text-anchor="middle" class="box-sub">(never retyped from memory) — source labels are preserved,</text>
    <text x="650" y="548" text-anchor="middle" class="box-sub">not stripped or renamed</text>

    <path d="M650,560 L650,586" class="edge"/>

    <!-- ============ FINAL ANSWER ============ -->
    <rect x="380" y="588" width="540" height="118" rx="10" class="node-fill" stroke="#4a3aa7" stroke-width="1.6"/>
    <text x="650" y="612" text-anchor="middle" class="box-label">Answer shown to user</text>
    <text x="650" y="630" text-anchor="middle" class="box-sub">Each fact is tagged with where it came from:</text>

    <g>
      <rect x="400" y="644" width="112" height="24" rx="12" class="badge"/>
      <text x="456" y="660" text-anchor="middle" class="badge-text">[graph match]</text>

      <rect x="522" y="644" width="118" height="24" rx="12" class="badge"/>
      <text x="581" y="660" text-anchor="middle" class="badge-text">[cypher match]</text>

      <rect x="650" y="644" width="130" height="24" rx="12" class="badge"/>
      <text x="715" y="660" text-anchor="middle" class="badge-text">[component match]</text>

      <rect x="400" y="674" width="150" height="24" rx="12" class="badge"/>
      <text x="475" y="690" text-anchor="middle" class="badge-text">[semantic scholar]</text>

      <rect x="560" y="674" width="130" height="24" rx="12" class="badge"/>
      <text x="625" y="690" text-anchor="middle" class="badge-text">[semantic match]</text>

      <rect x="700" y="674" width="120" height="24" rx="12" class="badge"/>
      <text x="760" y="690" text-anchor="middle" class="badge-text">[hybrid match]</text>
    </g>

    <!-- ============ LEGEND ============ -->
    <text x="70" y="750" class="box-label" font-size="13">Tool color key</text>
    <g font-size="11.5">
      <rect x="70" y="762" width="14" height="14" rx="3" fill="#2a78d6" class="legend-swatch"/>
      <text x="90" y="773" class="legend-text">search_datasets — semantic/vector similarity</text>

      <rect x="70" y="784" width="14" height="14" rx="3" fill="#008300" class="legend-swatch"/>
      <text x="90" y="795" class="legend-text">get_dataset_details — exact structured query (Cypher)</text>

      <rect x="440" y="762" width="14" height="14" rx="3" fill="#eda100" class="legend-swatch"/>
      <text x="460" y="773" class="legend-text">get_workflow_guidance — curated how-to steps</text>

      <rect x="440" y="784" width="14" height="14" rx="3" fill="#1baf7a" class="legend-swatch"/>
      <text x="460" y="795" class="legend-text">get_educational_context — domain Q&amp;A</text>

      <rect x="900" y="762" width="14" height="14" rx="3" fill="#eb6834" class="legend-swatch"/>
      <text x="920" y="773" class="legend-text">search_literature — external publications</text>

      <rect x="900" y="784" width="14" height="14" rx="3" fill="#4a3aa7" class="legend-swatch"/>
      <text x="920" y="795" class="legend-text">conversation_manager.py — orchestrator (router + synthesis)</text>
    </g>

    <!-- ============ KEY DESIGN NOTE ============ -->
    <rect x="70" y="818" width="1160" height="110" rx="10" fill="none" stroke="#e1e0d9" stroke-width="1.4" stroke-dasharray="3 3"/>
    <text x="90" y="842" class="box-sub" font-weight="600" font-size="12.5">Why routing has no separate classifier step</text>
    <text x="90" y="862" class="box-file" font-size="11.5">There is no hardcoded intent dispatcher. The LLM inside conversation_manager.py reads each tool's docstring/description</text>
    <text x="90" y="879" class="box-file" font-size="11.5">(in tools.py) plus its own system prompt, and picks the matching tool — this is the "ReAct" pattern (Reason + Act) via</text>
    <text x="90" y="896" class="box-file" font-size="11.5">LangGraph's create_react_agent(). Cross-intent queries (e.g. "explain X and find datasets that measure it") call multiple</text>
    <text x="90" y="913" class="box-file" font-size="11.5">tools in sequence and synthesize one response, preserving every source label so the answer stays traceable to its origin.</text>
  </g>
</svg>
