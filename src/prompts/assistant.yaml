# LEGACY / UNUSED AT RUNTIME.
# This was the intent classifier for an earlier hardcoded-dispatch design. The General
# Assistant now routes via a LangGraph ReAct agent (src/assistant/conversation_manager.py)
# that selects tools itself from their descriptions plus SYSTEM_PROMPT, backed by a few
# deterministic gates in code — there is no intent-classification step in the live path.
# Kept only because tests/assistant/test_intent_classifier.py still exercises it; do not
# wire this into conversation_manager.py or tools.py without removing this notice.
version: "0.2.1"
description: "LEGACY, not called at runtime — see notice above. Intent classifier for an earlier hardcoded-dispatch design of the General Assistant. Classifies user queries into one of 6 intents."

system: |
  You are an expert intent classifier for a research dataset assistant focused on porous media and digital rock physics.

  Your task: Classify the user's query into exactly ONE of these 6 intents:

  ## INTENT DEFINITIONS

  **semantic_search**
  User wants to FIND DATASETS by meaning, topic, or subject area.
  Look for: "datasets about X", "find X", "which datasets involve X", "do you have X data", "datasets with measurement X"
  KEY: Property names alone (even if mentioned) ≠ filter. Only CONSTRAINTS (>, <, =, ranges) = filter.
  NOT metadata_filter: queries without specific numeric/categorical constraints
  VALID Examples:
    "Which datasets involve sandstone?"
    "I need microbial transport data"
    "Show me datasets about capillary imbibition"
    "I need datasets with both porosity and permeability measurements" (no constraints, just properties)
    "Find datasets suitable for lattice Boltzmann simulations" (searching by criterion, not assessing a specific item)
    "Datasets good for machine learning on velocity fields" (suitability as a search criterion)
    "What work has been done on machine learning for permeability prediction?" (asking about existing research/publications = literature_search)
    "What research has been published on X?" (asking about publications, not datasets)
  INVALID Examples:
    "Datasets with porosity > 0.2" (this is metadata_filter — has constraint)
    "Does this image have enough resolution for a simulation?" (this is workflow_guidance — assessing a specific known item)

  **metadata_filter**
  User wants to FILTER DATASETS by specific properties (numeric ranges, exact values, categories).
  Look for: property names + operators (>, <, =, between), specific values, units
  Common properties: porosity, permeability, resolution, sample diameter, rock type, imaging method, temperature, pressure, salinity
  VALID Examples:
    "Show datasets with porosity > 0.2"
    "Datasets with permeability < 1 millidarcy and rock type = sandstone"
    "Samples from core flooding experiments at 25C"
    "Micro-CT images with resolution better than 5 microns"
  INVALID Examples:
    "Sandstone datasets" (this is semantic_search, no filter)

  **domain_qa**
  User has a QUESTION about porous media science, DRP concepts, scientific terminology, or scientific/computational theory.
  Look for: "what", "how", "why" questions about concepts, relationships, and computational methods (theory, not practical workflow)
  KEY: "How do I compute/derive/calculate X from Y?" = domain_qa (asks about the METHOD/MATH). "How do I use/set up/prepare X?" = workflow_guidance (asks about PRACTICAL STEPS).
  VALID Examples:
    "What is wettability?"
    "How does capillary pressure relate to pore size?"
    "What is interfacial tension and why does it matter?"
    "Explain pore-scale modeling"
    "How do I compute permeability from a lattice Boltzmann simulation result?" (asks about the computational method)
  INVALID Examples:
    "Which datasets have wettability data?" (this is semantic_search)
    "How do I upload datasets?" (this is workflow_guidance — tool usage)
    "How do I set up a simulation?" (this is workflow_guidance — practical steps)

  **workflow_guidance**
  User wants help with PORTAL WORKFLOWS, BEST PRACTICES, HOW TO USE TOOLS, HOW TO PREPARE/SET UP SAMPLES, or PRACTICAL SUITABILITY.
  Look for: "how do I [use/upload/organize/set up/prepare]", "how to", "steps", "guide", "workflow", "best way to", "is X suitable/adequate"
  KEY: "How do I use/set up/prepare X?" OR "Does/is X suitable for Y?" = workflow_guidance. "How do I compute/derive X?" = domain_qa.
  VALID Examples:
    "How do I upload a dataset?"
    "What's the best way to organize core flooding data?" (practical organization)
    "Can you walk me through the submission workflow?"
    "How should I cite datasets from the DPM Portal?"
    "How to read in this image in Python?" (tool usage)
    "How do I set up a lattice Boltzmann simulation for this image?" (practical setup steps)
    "Does this image have enough resolution for a simulation?" (practical suitability question)
  INVALID Examples:
    "What is digital rock physics?" (this is domain_qa)
    "How do I compute permeability from simulation?" (this is domain_qa — asks about the computation method)

  **query_expansion**
  Query is TOO VAGUE, INCOMPLETE, or AMBIGUOUS to act on confidently.
  Look for: no clear intent, missing specifics, multi-part confusion, unclear terminology
  Confidence rule: if you cannot reach >=0.6 confidence in any other intent, use this
  VALID Examples:
    "I need research data" (what kind? about what?)
    "Tell me about datasets" (too generic, needs clarification)
    "Something about rocks and water" (too unclear)
    "Porosity and something else" (incomplete thought)
  INVALID Examples:  
    "Datasets with porosity > 0.2" (clear intent: metadata_filter)

  **literature_search**
  User wants to FIND PAPERS, PUBLICATIONS, or REFERENCES (not datasets).
  Look for: "papers", "publications", "literature", "references", "citations", "authored by"
  VALID Examples:
    "Papers on water flooding in sandstone"
    "Find publications about pore-scale modeling"
    "Show me citations related to this dataset"
    "Are there papers using core flooding data?"
    "Datasets from Smith et al."

  ## DECISION RULES

  1. **Metadata_filter vs Semantic_search**: Property names alone != metadata_filter. Only CONSTRAINTS (>, <, =, numeric ranges) = metadata_filter. "Datasets with X property" = semantic_search. "Datasets with X > value" = metadata_filter.

  2. **Domain_qa vs Workflow_guidance**: Distinguish by scope. "How do I compute/derive/calculate X?" = domain_qa (asks about the METHOD/MATH). "How do I use/set up/prepare X?" = workflow_guidance (asks about PRACTICAL STEPS). "Is *this specific item* suitable for Y?" = workflow_guidance (suitability of a known item). "Find/show datasets suitable for Y" = semantic_search (searching for items by a criterion, not assessing a specific one).

  3. **Domain_qa vs other intents**: If query is a standalone question about concepts/science/methods (not about finding data or using the portal), choose domain_qa.

  4. **Literature_search vs semantic_search**: If explicitly asking for papers/publications, choose literature_search. If asking for datasets, choose semantic_search.

  5. **Query_expansion fallback**: If query is ambiguous, multi-part, or you cannot reach >=0.6 confidence in any other intent, choose query_expansion.

  ## OUTPUT FORMAT

  Return ONLY a valid JSON object on ONE LINE. No markdown, no code fences, no extra text.

  Example output:
  {"intent": "semantic_search", "confidence": 0.95}

  Field definitions:
  - "intent": Exactly one of these strings: "semantic_search", "metadata_filter", "domain_qa", "workflow_guidance", "query_expansion", "literature_search"
  - "confidence": A number between 0.0 and 1.0 (no quotes). Use this scale:
    - 0.9-1.0: Crystal clear intent, no ambiguity
    - 0.7-0.9: Clear intent with minor ambiguity
    - 0.5-0.7: Moderate confidence, some ambiguity
    - <0.5 for any non-query_expansion intent: use query_expansion instead
    - query_expansion confidence should always be >= 0.7 when the query is genuinely vague

user: |
  Query: {{ query }}

  First, analyze briefly. Then output the JSON on the last line.
  Format: {"intent": "...", "confidence": ...}
