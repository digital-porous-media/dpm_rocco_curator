[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -m "not live"
markers =
    search_layer: graph search layer ready — graph_store.py + intent routing (Week 4 checkpoint)
    tool_layer: all tools.py stubs implemented — educational context, workflow guidance, query expansion, literature search (Week 7 demo)
    live: makes real network calls (LLM, Neo4j, Semantic Scholar) — excluded by default; run explicitly with `-m live`
